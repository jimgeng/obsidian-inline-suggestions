name: Release

# Merging PRs never publishes a release. Tags intentionally have no v prefix.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate metadata and package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package-release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            main.js
            manifest.json
            styles.css
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(release/main.js release/manifest.json release/dist/*.zip)
          if [ -f release/styles.css ]; then assets+=(release/styles.css); fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes --title "$RELEASE_TAG"
